<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 2400"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02080d"/>
      <stop offset="48%" stop-color="#071a1b"/>
      <stop offset="100%" stop-color="#02070b"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#49ffad" stop-opacity="0"/>
      <stop offset="34%" stop-color="#7cffb2" stop-opacity=".52"/>
      <stop offset="57%" stop-color="#6fd3ff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#9d7cff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#7cffb2" stop-opacity=".20"/>
      <stop offset="52%" stop-color="#6fd3ff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="2400" fill="url(#bg)"/>

  <ellipse cx="900" cy="420" rx="520" ry="350" fill="url(#glow)"/>
  <ellipse cx="230" cy="1790" rx="520" ry="400"
           fill="#8e6cff" fill-opacity=".07"/>

  <path d="M-180 760
