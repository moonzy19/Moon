        stroke-opacity=".12"
        stroke-width="68"/>

  <g fill="#ffffff">
    <circle cx="110" cy="180" r="2"/>
    <circle cx="315" cy="320" r="1.6"/>
    <circle cx="710" cy="180" r="1.8"/>
    <circle cx="1050" cy="340" r="2"/>
    <circle cx="900" cy="790" r="1.5"/>
    <circle cx="160" cy="1200" r="1.8"/>
    <circle cx="1030" cy="1320" r="1.6"/>
    <circle cx="430" cy="1660" r="2"/>
    <circle cx="850" cy="1910" r="1.7"/>
    <circle cx="1140" cy="2190" r="1.8"/>
