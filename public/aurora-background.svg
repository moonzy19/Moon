  <path d="M-220 1000
           C120 650 280 1180 520 830
           C790 440 1000 760 1420 390"
        fill="none"
        stroke="#65eaff"
        stroke-opacity=".18"
        stroke-width="86"/>

  <path d="M-160 1190
           C160 890 340 1330 610 1010
           C880 690 1080 950 1370 700"
