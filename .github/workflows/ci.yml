name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run lint
      - run: npm run audit
      - run: npm run audit:i18n
      - run: npm run audit:ui
      - run: npm run audit:css
      - run: npm run audit:notifications
      - run: npm run audit:theme
      - run: npm run audit:pwa
      - run: npm run audit:professional
      - run: npm run audit:presentation
      - run: npm run audit:platform
      - run: npm run audit:hardening
      - run: npm run build
      - run: npm run build -- --mode android
